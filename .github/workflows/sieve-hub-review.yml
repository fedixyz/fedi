name: 'Sieve hub review'
run-name: 'Sieve review ${{ inputs.repo || github.repository }}#${{ inputs.pr_number || github.event.issue.number }}'

# Two entry points: dispatch with a repo + PR number (manually or from the
# cron sweep), or say sieve in a comment on a PR here (comment events only
# reach the repo hosting the workflow, so the tag covers fedi PRs; other
# repos are dispatch-only). Both review the PR regardless of draft or CI
# state.
on:
    workflow_dispatch:
        inputs:
            repo:
                description: 'Target repo (owner/name)'
                required: true
            pr_number:
                description: 'PR number to review'
                required: true
    issue_comment:
        types: [created]

permissions:
    contents: read
    # gh pr view needs the read; the sticky comment needs the write
    pull-requests: write

env:
    SIEVE_HOST: https://sieve.fedi.xyz

jobs:
    review:
        name: 'Publish sieve review'
        # Sieve's own sticky comment says "sieve", so dropping the bot check
        # would let it review its own review forever.
        if: >-
            github.event_name == 'workflow_dispatch' ||
            (github.event.issue.pull_request != null &&
             github.event.comment.user.type != 'Bot' &&
             contains(github.event.comment.body, 'sieve') &&
             (github.event.comment.author_association == 'OWNER' ||
              github.event.comment.author_association == 'MEMBER' ||
              github.event.comment.author_association == 'COLLABORATOR'))
        # Job-level so skipped comment runs never enter the group. The sweep
        # re-dispatches a PR whose review is still in flight, so cancelling
        # would restart the review on every tick.
        concurrency:
            group: sieve-hub-review-${{ inputs.repo || github.repository }}-${{ inputs.pr_number || github.event.issue.number }}
            cancel-in-progress: false
        # the emulator only boots here: qemu segfaults under the linux runner units
        runs-on: [self-hosted, macos, arm64, macstadium, gui]
        # an uncached branch cold-builds the android bridge
        timeout-minutes: 120
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

            - name: Capture and publish the review
              id: review
              env:
                  REPO: ${{ inputs.repo || github.repository }}
                  PR_NUMBER: ${{ inputs.pr_number || github.event.issue.number }}
                  COMMENT_BODY: ${{ github.event.comment.body }}
                  SIEVE_TOKEN: ${{ secrets.SIEVE_TOKEN }}
                  # Either credential runs the agent; with neither the job
                  # falls back to a mechanical recap.
                  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
                  CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
                  # the org PAT carries cross-repo read; the job-token floor reads this repo only
                  GH_TOKEN: ${{ secrets.GH_PAT_FEDIBTC_READ_ONLY || github.token }}
                  # Avoid anonymous GitHub API rate limits during the Nix fetch.
                  NIX_CONFIG: access-tokens = github.com=${{ github.token }}
              run: ./scripts/ci/sieve-hub-review.sh

            # installation tokens expire after an hour, and the review step
            # alone often runs longer
            - name: Mint the app token the comment posts under
              id: comment-token
              if: steps.review.outputs.review_id != '' && vars.SIEVE_HUB_APP_ID != ''
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
              with:
                  app-id: ${{ vars.SIEVE_HUB_APP_ID }}
                  private-key: ${{ secrets.SIEVE_HUB_APP_PRIVATE_KEY }}
                  owner: fedibtc

            # this step also deletes the checkout, so it runs even on failure
            - name: Post the sticky PR comment
              if: always() && steps.review.outputs.workdir != ''
              env:
                  SIEVE_REV: ${{ steps.review.outputs.rev }}
                  SIEVE_TOKEN: ${{ secrets.SIEVE_TOKEN }}
                  SIEVE_REVIEW_ID: ${{ steps.review.outputs.review_id }}
                  SIEVE_WORKDIR: ${{ steps.review.outputs.workdir }}
                  # a comment from a person re-triggers this workflow, since
                  # the job's bot check only skips a Bot author
                  GH_TOKEN: ${{ steps.comment-token.outputs.token || secrets.GH_PAT_FEDIBTC_READ_ONLY || github.token }}
                  # the app is installed on selected repos only
                  SIEVE_FALLBACK_GH_TOKEN: ${{ secrets.GH_PAT_FEDIBTC_READ_ONLY || github.token }}
                  # Avoid anonymous GitHub API rate limits during the Nix fetch.
                  NIX_CONFIG: access-tokens = github.com=${{ github.token }}
              run: ./scripts/ci/sieve-hub-pr-comment.sh
