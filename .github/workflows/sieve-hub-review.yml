name: 'Sieve hub review'

# Two entry points: dispatch with a repo + PR number, or say sieve in a comment
# on a PR here (comment events only reach the repo hosting the workflow, so
# the tag covers fedi PRs; other repos are dispatch-only). Both review the
# PR regardless of draft or CI state.
on:
    workflow_dispatch:
        inputs:
            repo:
                description: 'Target repo (owner/name)'
                required: true
            pr_number:
                description: 'PR number to review'
                required: true
    issue_comment:
        types: [created]

permissions:
    contents: read

env:
    SIEVE_HOST: https://sieve.fedi.xyz

jobs:
    review:
        name: 'Publish sieve review'
        # Sieve's own sticky comment says "sieve", so dropping the bot check
        # would let it review its own review forever.
        if: >-
            github.event_name == 'workflow_dispatch' ||
            (github.event.issue.pull_request != null &&
             github.event.comment.user.type != 'Bot' &&
             contains(github.event.comment.body, 'sieve') &&
             (github.event.comment.author_association == 'OWNER' ||
              github.event.comment.author_association == 'MEMBER' ||
              github.event.comment.author_association == 'COLLABORATOR'))
        # Job-level, not workflow-level: every comment in the repo creates a
        # run that joins a workflow-level group before the job `if` runs, so
        # an unrelated comment would cancel an in-flight review. A skipped
        # job never acquires a job-level group.
        concurrency:
            group: sieve-hub-review-${{ inputs.repo || github.repository }}-${{ inputs.pr_number || github.event.issue.number }}
            cancel-in-progress: true
        # The e2e macs, whose emulators work today; the linux runners hide
        # /dev/kvm from jobs, so move back once devops exposes it.
        runs-on: [self-hosted, macos, arm64, macstadium, gui]
        # Cold runners compile sieve from source, and a ui PR adds an
        # emulator capture pass (apk build + two metro tours).
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

            - name: Check the comment calls sieve by name
              id: trigger
              if: github.event_name == 'issue_comment'
              env:
                  COMMENT_BODY: ${{ github.event.comment.body }}
              run: ./scripts/ci/sieve-comment-trigger.sh

            - name: Mint the cross-repo app token
              id: app-token
              if: steps.trigger.outputs.matched != 'false' && vars.SIEVE_HUB_APP_ID != ''
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
              with:
                  app-id: ${{ vars.SIEVE_HUB_APP_ID }}
                  private-key: ${{ secrets.SIEVE_HUB_APP_PRIVATE_KEY }}
                  owner: fedibtc

            - name: Resolve the deployed sieve release
              id: sieve-release
              if: steps.trigger.outputs.matched != 'false'
              env:
                  GH_TOKEN: ${{ github.token }}
                  # Avoid anonymous GitHub API rate limits during the Nix fetch.
                  NIX_CONFIG: access-tokens = github.com=${{ github.token }}
              # The runner has no gh on PATH.
              run: nix shell nixpkgs#gh --command ./scripts/ci/sieve-latest-release.sh >> "$GITHUB_OUTPUT"

            - name: Capture UI screenshots on an emulator
              if: steps.trigger.outputs.matched != 'false'
              # A capture failure must never cost the review itself.
              continue-on-error: true
              env:
                  GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.SIEVE_HUB_TOKEN }}
                  # Avoid anonymous GitHub API rate limits during the Nix fetch.
                  NIX_CONFIG: access-tokens = github.com=${{ github.token }}
                  REPO: ${{ inputs.repo || github.repository }}
                  PR_NUMBER: ${{ inputs.pr_number || github.event.issue.number }}
                  OUT_DIR: ${{ github.workspace }}/sieve-screenshots
              # The dev shell carries the emulator and app toolchain; the
              # runner has no gh, jq, or imagemagick on PATH.
              run: nix develop -c nix shell nixpkgs#gh nixpkgs#jq nixpkgs#imagemagick --command ./scripts/ci/sieve-hub-capture.sh

            - name: Publish review and sticky PR comment
              if: steps.trigger.outputs.matched != 'false'
              env:
                  SIEVE_REV: ${{ steps.sieve-release.outputs.rev }}
                  SIEVE_TOKEN: ${{ secrets.SIEVE_TOKEN }}
                  # Either credential runs the agent; with neither the job
                  # falls back to a mechanical recap.
                  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
                  CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
                  GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.SIEVE_HUB_TOKEN }}
                  # Avoid anonymous GitHub API rate limits during the Nix fetch.
                  NIX_CONFIG: access-tokens = github.com=${{ github.token }}
                  # claude-code is unfree; nix only honors this when the eval is --impure.
                  NIXPKGS_ALLOW_UNFREE: '1'
                  REPO: ${{ inputs.repo || github.repository }}
                  PR_NUMBER: ${{ inputs.pr_number || github.event.issue.number }}
                  SIEVE_SCREENSHOTS_DIR: ${{ github.workspace }}/sieve-screenshots
              # The generic Linux binary does not run on NixOS.
              run: nix shell --impure "github:fedibtc/sieve/${SIEVE_REV}#sieve" nixpkgs#claude-code nixpkgs#gh nixpkgs#jq nixpkgs#git --command ./scripts/ci/sieve-hub-review.sh "$REPO" "$PR_NUMBER"
