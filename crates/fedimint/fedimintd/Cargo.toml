[package]
name = "fedi-fedimintd"
version = "0.3.0"
authors = ["The Fedi Developers"]
edition = "2024"
description = "fedimintd with custom fedi modules"

[features]
# On by default so the shipped binary gets it without any build-flag ceremony.
default = ["jemalloc"]
jemalloc = ["dep:tikv-jemallocator"]

[[bin]]
name = "fedimintd"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
fedimintd = { workspace = true }
tokio = { workspace = true, features = ["full", "tracing"] }
env = { workspace = true }
fedi-social-server = { workspace = true }
fedi-social-common = { workspace = true }
fedimint-core = { workspace = true }
fedimint-server-core = { workspace = true }
stability-pool-server-old = { workspace = true }
stability-pool-server = { workspace = true }
tracing = { workspace = true }

[target.'cfg(not(any(target_env = "msvc", target_os = "ios", target_os = "android")))'.dependencies]
tikv-jemallocator = { workspace = true, optional = true }

[build-dependencies]
fedimint-build = { workspace = true }
